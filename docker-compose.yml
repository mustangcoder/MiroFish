name: mirofish

services:
  direct-oauth-gateway:
    build:
      context: .
      dockerfile: direct_gateway/Dockerfile
    container_name: mirofish-direct-oauth-gateway
    env_file:
      - .env
    environment:
      DIRECT_GATEWAY_TOKEN: ${DIRECT_GATEWAY_TOKEN:-mirofish-local-only}
      DIRECT_MAX_CONCURRENCY: ${DIRECT_MAX_CONCURRENCY:-8}
    expose:
      - "8090"
    volumes:
      - direct_oauth_credentials:/var/lib/direct-oauth
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  hf-prefetch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mirofish-hf-prefetch
    environment:
      HF_HOME: /var/lib/mirofish/huggingface
      HUGGINGFACE_HUB_CACHE: /var/lib/mirofish/huggingface/hub
      HF_XET_CACHE: /var/lib/mirofish/huggingface/xet
      TRANSFORMERS_CACHE: /var/lib/mirofish/huggingface/hub
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: 60
      HF_REQUIRED_MODELS: Twitter/twhin-bert-base
    command: ["timeout", "900", "uv", "run", "--project", "backend", "python", "backend/scripts/prefetch_huggingface.py", "Twitter/twhin-bert-base"]
    volumes:
      - huggingface_cache:/var/lib/mirofish/huggingface
    restart: "on-failure:3"

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: mirofish-local:latest
    container_name: mirofish-bootstrap
    env_file:
      - .env
    command: ["uv", "run", "--project", "backend", "python", "backend/scripts/bootstrap_local.py"]
    restart: "no"
    volumes:
      - ./backend/uploads:/app/backend/uploads

  mirofish:
    build:
      context: .
      dockerfile: Dockerfile
    image: mirofish-local:latest
    container_name: mirofish
    env_file:
      - .env
    environment:
      DIRECT_GATEWAY_TOKEN: ${DIRECT_GATEWAY_TOKEN:-mirofish-local-only}
      DIRECT_OAUTH_GATEWAY_URL: http://direct-oauth-gateway:8090
      HF_HOME: /var/lib/mirofish/huggingface
      HUGGINGFACE_HUB_CACHE: /var/lib/mirofish/huggingface/hub
      HF_XET_CACHE: /var/lib/mirofish/huggingface/xet
      TRANSFORMERS_CACHE: /var/lib/mirofish/huggingface/hub
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: 60
      HF_REQUIRED_MODELS: Twitter/twhin-bert-base
      HF_MODEL_DOWNLOAD_TIMEOUT_SECONDS: 900
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    depends_on:
      direct-oauth-gateway:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - huggingface_cache:/var/lib/mirofish/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

volumes:
  direct_oauth_credentials:
  huggingface_cache:
