[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # LLM 相关
    "openai>=1.0.0",
    "anthropic>=0.75.0,<1",
    "cryptography>=46.0.0",

    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",

    # 文件处理
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Graphiti 与 OASIS 统一使用同一 Neo4j Python Driver
    "neo4j==5.26.0",
]

[project.optional-dependencies]
# Graphiti 本地后端 (替代 Zep Cloud)
# 安装: uv sync --extra graphiti
# 启用: ZEP_BACKEND=graphiti
graphiti = [
    "graphiti-core>=0.25.0,<0.26.0",
]

# OASIS 社交媒体模拟
# 安装: uv sync --extra oasis
oasis = [
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
override-dependencies = [
    # camel-oasis 0.2.5 锁定 5.23.0；同一主版本内 API 兼容，统一覆盖为 5.26.0。
    "neo4j==5.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
